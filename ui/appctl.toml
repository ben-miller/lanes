# What `appctl up` runs in this repo (see ~/src/dev-infra/README.md):
#   appctl up            attached; Ctrl+C stops the whole tree
#   appctl up -d         detached; then appctl status / logs -f / down
name = "lanes"

# Same reasoning as boards/appctl.toml: tauri-plugin-single-instance hands
# a second launch with the same bundle identifier (com.lanes.ui) off to an
# already-running copy and exits silently - with the installed /Applications
# copy open, the dev binary would just vanish. The [l] keeps pkill from
# matching this command's own `sh -c` line.
before = "pkill -f '/Applications/Lanes Switch.app/Contents/MacOS/[l]anes-ui'"

# This app depends on lanes-cli by path; tauri dev watches it too through
# build.additionalWatchFolders in src-tauri/tauri.conf.json (see
# ~/src/projects/CONVENTIONS.md, "Hot-reloading a Rust path dependency
# during tauri dev"), so no cargo watch wrapper is needed.
cmd = "npm run tauri dev"
