[package]
name = "lanes-ui"
version = "0.1.0"
edition = "2021"

[lib]
name = "lanes_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lanes = { path = "../../../lanes-cli" }
notify = "6"
ignore = "0.4"
# Just for tokio::time::sleep (arming the running-chip notice-floor timer -
# see arm_pending_running in lib.rs). Runs on tauri::async_runtime's own
# already-running tokio runtime, not a separate one.
tokio = { version = "1", features = ["time"] }
