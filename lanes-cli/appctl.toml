# What `appctl up` runs in this repo (see ~/src/dev-infra/README.md):
#   appctl up            attached; Ctrl+C stops the whole tree
#   appctl up -d         detached; then appctl status / logs -f / down
name = "lanes-cli"

# `lanes` (the binary `~/.local/bin/lanes` symlinks to - see
# ~/src/projects/CONVENTIONS.md, "Keeping a plain CLI binary fresh during
# development") is invoked fresh on every call, not a long-running process,
# so there's nothing to restart - only something to keep rebuilt. `cargo
# watch -x build` is that: a rebuild on every source change, so the next
# invocation of `lanes` (a hotkey, switch-ui, `lanes focus ...`) always
# picks up current code instead of whatever was last built by hand.
cmd = "cargo watch -x build"
